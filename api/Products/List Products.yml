info:
  name: List Products
  type: http
  seq: 1

http:
  method: GET
  url: "{{BaseUrl}}/products?pageSize=20&page=1"
  params:
    - name: pageSize
      value: "20"
      type: query
    - name: page
      value: "1"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
