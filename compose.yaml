# BeanStock en local. Prérequis : copier .env.example en .env et renseigner le mot de passe.
#
#   docker compose up -d                          → SQL Server seul ; l'API et le Worker se lancent
#                                                   depuis Visual Studio (ou `dotnet run`).
#   docker compose --profile app up -d --build    → toute la pile : SQL Server, migrations,
#                                                   API (http://localhost:5080) et 2 Workers.
#   docker compose --profile app down             → arrêt (ajouter -v pour supprimer les données).
name: beanstock

# Chaîne de connexion des conteneurs applicatifs (réseau interne Docker : hôte « sqlserver »).
# Compte sa : acceptable pour un environnement local de démonstration uniquement.
x-db-connection: &db-connection "Server=sqlserver,1433;Database=BeanStock;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: beanstock-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      # Obligatoire : défini dans .env (jamais versionné)
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Définir MSSQL_SA_PASSWORD dans le fichier .env}
    ports:
      # Port côté machine hôte configurable si un SQL Server local occupe déjà 1433
      - "${MSSQL_HOST_PORT:-1433}:1433"
    volumes:
      # Volume nommé : les données survivent à `docker compose down` (mais pas à `down -v`)
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Applique les migrations une seule fois, avant l'API et les Workers.
  # Les instances applicatives ne modifient jamais le schéma elles-mêmes.
  migrator:
    profiles: [app]
    build:
      context: .
      dockerfile: src/BeanStock.Api/Dockerfile
      target: migrator
    image: beanstock-migrator:local
    command: ["--connection", *db-connection]
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

  api:
    profiles: [app]
    build:
      context: .
      dockerfile: src/BeanStock.Api/Dockerfile
      target: final
    image: beanstock-api:local
    environment:
      # Development : documentation interactive Scalar disponible sur /scalar
      ASPNETCORE_ENVIRONMENT: Development
      Database__ApplyMigrationsOnStartup: "false"
      ConnectionStrings__BeanStock: *db-connection
    ports:
      - "${API_HOST_PORT:-5080}:8080"
    depends_on:
      migrator:
        condition: service_completed_successfully

  # Deux instances : la planification et le verrou distribué garantissent
  # qu'une seule synchronisation s'exécute par période (visible dans les logs).
  worker:
    profiles: [app]
    build:
      context: .
      dockerfile: src/BeanStock.Worker/Dockerfile
      target: final
    image: beanstock-worker:local
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__BeanStock: *db-connection
    deploy:
      replicas: 2
    depends_on:
      migrator:
        condition: service_completed_successfully

volumes:
  sqlserver-data:
